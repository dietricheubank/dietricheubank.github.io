name: Scoring model tests
on:
  push:
    paths:
      - 'tools/priority-scoring/**'
      - '.github/workflows/scoring-tests.yml'
  pull_request:
    paths:
      - 'tools/priority-scoring/**'
      - '.github/workflows/scoring-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scoring engine tests
        working-directory: tools/priority-scoring
        run: python -m unittest -v test_scoring.py
