name: Public website validation
on:
  push:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.svg'
      - 'sitemap.xml'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local navigation and assets
        run: python -m unittest discover -s tests -v
