<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc"><title id="title">Human approval in a synthetic AI operations workflow</title><desc id="desc">Telemetry leads to analysis and risk review; human approval decides whether a simulated action is taken; decisions are logged.</desc><rect width="1180" height="360" rx="12" fill="#0c1b2d"/><g font-family="Arial,sans-serif"><text x="34" y="49" font-size="26" font-weight="bold" fill="#f2f7ff">Human-in-the-loop control flow</text><text x="34" y="77" font-size="15" fill="#a6bfd1">Fictional, read-only telemetry · Explicit approval · Audited simulated action</text><g fill="#172d43" stroke="#547b89" stroke-width="2"><rect x="30" y="135" width="190" height="105" rx="12"/><rect x="262" y="135" width="190" height="105" rx="12"/><rect x="495" y="135" width="190" height="105" rx="12"/><rect x="728" y="135" width="190" height="105" rx="12"/><rect x="960" y="135" width="190" height="105" rx="12"/></g><g font-size="18" font-weight="bold" text-anchor="middle" fill="#f2f7ff"><text x="125" y="176">Observe</text><text x="357" y="176">Analyze</text><text x="590" y="176">Risk review</text><text x="823" y="176">Human gate</text><text x="1055" y="176">Simulate</text></g><g font-size="14" text-anchor="middle" fill="#afc6d4"><text x="125" y="205">Synthetic signals</text><text x="357" y="205">Summarize</text><text x="590" y="205">Explain tradeoffs</text><text x="823" y="205">Approve / reject</text><text x="1055" y="205">Log outcome</text></g><g stroke="#7de6d2" stroke-width="4" fill="none"><path d="M220 186H258"/><path d="M452 186H491"/><path d="M685 186H724"/><path d="M918 186H956"/></g><g fill="#7de6d2"><path d="M258 186l-12 -8v16z"/><path d="M491 186l-12 -8v16z"/><path d="M724 186l-12 -8v16z"/><path d="M956 186l-12 -8v16z"/></g><text x="823" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#ffd3a8">Default deny; rejected actions stop here</text></g></svg>