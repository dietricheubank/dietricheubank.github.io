<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Illustrative two-node AI platform architecture</title><desc id="desc">Browser to Open WebUI to LiteLLM to TensorRT-LLM, running Qwen model on two NVIDIA GB10 nodes with observability to Prometheus and Grafana</desc><rect width="1200" height="540" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="54" y="66" font-size="34" font-weight="bold" fill="#f0f6ff">Local AI infrastructure · Reference architecture</text><text x="54" y="97" font-size="17" fill="#a8c1d5">Illustrative diagram based on the public GX10 case study · Not a live topology export</text><g fill="#17283d" stroke="#4f718a" stroke-width="2"><rect x="54" y="154" width="192" height="82" rx="12"/><rect x="290" y="154" width="192" height="82" rx="12"/><rect x="526" y="154" width="192" height="82" rx="12"/><rect x="762" y="154" width="382" height="82" rx="12"/><rect x="762" y="304" width="176" height="90" rx="12"/><rect x="968" y="304" width="176" height="90" rx="12"/><rect x="290" y="374" width="428" height="100" rx="12"/></g><g fill="#f0f6ff" font-size="21" text-anchor="middle" font-weight="bold"><text x="150" y="191">Browser</text><text x="386" y="191">Open WebUI</text><text x="622" y="191">LiteLLM</text><text x="953" y="191">TensorRT-LLM · TP=2</text><text x="850" y="342">GB10 node A</text><text x="1056" y="342">GB10 node B</text><text x="504" y="411">Prometheus + Grafana</text></g><g fill="#a8c1d5" font-size="15" text-anchor="middle"><text x="150" y="213">Operator interface</text><text x="386" y="213">Fast / Deep</text><text x="622" y="213">Model routing</text><text x="953" y="213">Qwen3 distributed inference</text><text x="850" y="365">GPU inference</text><text x="1056" y="365">GPU inference</text><text x="504" y="442">Monitoring · Health · Telemetry</text></g><g stroke="#63dccb" stroke-width="4" fill="none" stroke-linecap="round"><path d="M248 195H286"/><path d="M484 195H522"/><