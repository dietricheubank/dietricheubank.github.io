<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Illustrative project scoring dashboard preview</title><desc id="desc">Static conceptual preview with four fictional initiatives and scores</desc><rect width="1200" height="700" rx="18" fill="#0b1020"/><g font-family="Arial,sans-serif"><text x="56" y="72" font-size="17" letter-spacing="3" fill="#63dccb">DEMO PREVIEW · FICTIONAL DATA</text><text x="56" y="125" font-size="44" font-weight="bold" fill="#ecf3ff">Project Priority Studio</text><text x="56" y="161" font-size="20" fill="#afc0d7">Weighted scoring · Transparent rankings · Editable criteria</text><rect x="55" y="205" width="330" height="432" rx="16" fill="#17243a" stroke="#354c67"/><rect x="413" y="205" width="730" height="432" rx="16" fill="#17243a" stroke="#354c67"/><text x="83" y="253" font-size="25" fill="#f0f6ff" font-weight="bold">Criteria weights</text><g fill="#afc0d7" font-size="19"><text x="83" y="310">Strategic alignment</text><text x="335" y="310" text-anchor="end">30%</text><text x="83" y="372">Expected impact</text><text x="335" y="372" text-anchor="end">25%</text><text x="83" y="434">Urgency / risk</text><text x="335" y="434" text-anchor="end">20%</text><text x="83" y="496">Delivery readiness</text><text x="335" y="496" text-anchor="end">15%</text><text x="83" y="558">Efficiency</text><text x="335" y="558" text-anchor="end">10%</text></g><text x="449" y="255" font-size="26" font-weight="bold" fill="#f0f6ff">Ranked initiatives</text><g font-size="18" fill="#e7f0fc"><text x="449" y="320">Replace obsolete access process</text><text x="925" y="320">4.75</text><text x="449" y="396">Standardize endpoint baseline</text><text x="925" y="396">3.85</text><text x="449" y="472">Improve service knowledge base</text><text x="925" y="472">3.25</text><text x="449" y="548">Refresh meeting-room signage</text><text x="925" y="548">2.10</text></g><g font-size="16" font-weight="bold" text-anchor="middle"><rect x="982" y="291" width="130" height="42" rx="20" fill="#58303a"/><text x="1047" y="318" fill="#ffd3d9">CRITICAL</text><rect x="982" y="367" width="130" height="42" rx="20" fill="#5b452c"/><text x="1047" y="394" fill="#ffdea6">HIGH</text><rect x="982" y="443" width="130" height="42" rx="20" fill="#2c4e65"/><text x="1047" y="470" fill="#b6e1ff">MEDIUM</text><rect x="982" y="519" width="130" height="42" rx="20" fill="#2d5148"/><text x="1047" y="546" fill="#bef7db">LOW</text></g></g></svg>